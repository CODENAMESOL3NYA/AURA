<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Dark Background -->
    <rect id="bg" width="800" height="800" fill="#000000"/>

    <!-- Linear Gradients for Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="28%" stop-color="#FF5C8A"/>
      <stop offset="50%" stop-color="#E0AAFF"/>
      <stop offset="72%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <radialGradient id="irisBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#060709"/>
      <stop offset="42%" stop-color="#0c0e12"/>
      <stop offset="75%" stop-color="#161920"/>
      <stop offset="92%" stop-color="#0f1116"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <radialGradient id="pupil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="85%" stop-color="#030304"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>

    <!-- Halo Glow Left Red -->
    <radialGradient id="glowRed" cx="30%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#FF2A5F" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#FF2A5F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo Glow Right Cyan -->
    <radialGradient id="glowCyan" cx="70%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ringBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black Canvas -->
  <rect width="800" height="800" fill="#000000"/>

  <!-- Diffuse Glows Behind Ring -->
  <ellipse cx="365" cy="415" rx="285" ry="285" fill="url(#glowRed)"/>
  <ellipse cx="445" cy="415" rx="285" ry="285" fill="url(#glowCyan)"/>

  <!-- Iris Body -->
  <circle cx="405" cy="415" r="210" fill="url(#irisBase)"/>

