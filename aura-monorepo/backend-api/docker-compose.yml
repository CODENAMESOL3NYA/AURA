services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_dev_password
      POSTGRES_DB: aura
    ports: ["5432:5432"]
    volumes: ["aura_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ["5000:5000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  aura_pgdata:
